[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-enterprise-tools-lab"
version = "0.1.0"
description = "Synthetic tenant-scoped read-only enterprise tools for MCP Python SDK v2"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[tool.setuptools.packages.find]
include = ["enterprise_mcp*"]

[tool.setuptools.package-data]
enterprise_mcp = ["fixtures.json"]
